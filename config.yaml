# ISSUE EMERGENCE ENGINE 설정
# 코드에 값을 박지 않는다. 바꾸고 싶은 것은 전부 여기에 있다.

# ── 수집 기간 (YYYY-MM-DD) ─────────────────────────────
# 이 기간에 올라온 유튜브 영상만 검색한다.
period:
  start: "2026-08-25"
  end: "2026-09-01"

# ── 이슈 목록 (0단계: 사람이 직접 2~3개를 적는다) ──────
#   id           : 파일 이름에 쓰는 짧은 영문 이름 (한글·공백 금지)
#   keyword      : 유튜브에서 실제로 검색할 검색어
#   proper_nouns : 자동 정리에서 "원형 그대로 쓰면 탈락"시킬 고유명사
#                  (인물명·지명·기관명). 비워 두면 그 규칙은 거의 동작하지 않는다.
#   summary      : 비워 두면 어휘 추출 단계가 5줄 요약을 자동으로 만든다.
issues:
  - id: "nepal-flood"
    keyword: "네팔 대홍수"
    proper_nouns: ["네팔", "티베트", "히말라야", "라수와"]
    summary: ""
  - id: "cabinet-reshuffle"
    keyword: "개각 논란 용혜인"
    proper_nouns: ["용혜인", "이소영", "이재명", "김민석", "이진숙"]
    summary: ""
  - id: "approval-rating"
    keyword: "이재명 지지율 30%"
    proper_nouns: ["이재명", "리얼미터", "김어준"]
    summary: ""
  - id: "kim-hyuntae-defection"
    keyword: "김현태 변심 전한길"
    proper_nouns: ["김현태", "전한길", "성일종", "국민의힘"]
    summary: ""

# ── 이슈 찾기 ──────────────────────────────────────────
discover:
  # 기간을 정해 찾을 때 쓰는 씨앗 검색어. 이 말이 제목에 든 영상을 기간 안에서 긁는다.
  # 하나당 쿼터 100유닛이다 (기간 없이 지금 뜨는 것만 볼 때는 3유닛).
  seed_queries: [논란, 속보, 의혹, 파문, 갈등]
  per_query: 50

# ── 수집 ───────────────────────────────────────────────
collect:
  youtube:
    search_pool: 50        # 검색으로 먼저 긁어올 후보 영상 수 (한 번에 최대 50)
    videos_per_issue: 10   # 그중 최종으로 댓글을 받아올 영상 수
    comments_per_video: 100
    # 방송사 뉴스 채널을 우선한다. 채널명에 이 단어가 들어가면 앞으로 당긴다.
    prefer_channels: [KBS, MBC, SBS, JTBC, YTN, 연합뉴스, 채널A, MBN, TV조선, 뉴스]

# ── 활성 어휘 추출 ─────────────────────────────────────
vocab:
  rows_min: 20
  rows_max: 30
  comment_limit: 1000      # 좋아요 많은 순으로 이만큼만 LLM에 넣는다

# ── 발산 ───────────────────────────────────────────────
generate:
  per_call_min: 15
  per_call_max: 25
  mechanisms:
    - mech_01
    - mech_02
    - mech_03
    - mech_04
    - mech_05
    - mech_06
    - mech_07
    - mech_08
    - mech_09
  exclude_lookback_runs: 3  # 직전 몇 라운드를 볼 것인가
  exclude_min_count: 3      # 그 안에서 몇 번 이상 쓰인 원본 단어를 제외할 것인가

# ── 자동 정리 ──────────────────────────────────────────
filter:
  max_eojeol: 5             # 어절이 이보다 많으면 삭제

# ── LLM ────────────────────────────────────────────────
llm:
  # 무엇으로 돌릴지 고른다. 웹 화면에서 고른 값이 있으면 그쪽이 이긴다.
  #   claude_agent : 설치된 Claude Code를 그대로 쓴다. 구독으로 돌아가고 API 키가 필요 없다.
  #   gemini       : 본인이 발급받은 Gemini API 키로 돈다.
  #   anthropic    : Anthropic API 키로 돈다 (종량제).
  provider: claude_agent
  max_tokens: 16000

  claude_agent:
    model: ""               # 비우면 Claude Code 기본 모델. sonnet / opus / haiku 도 가능
    effort: "medium"        # low / medium / high / xhigh / max — 낮출수록 빠르다


  gemini:
    model: ""               # 비우면 gemini-flash-latest. 화면에서 키로 실제 목록을 불러와 고른다
    temperature: 1.0        # 다양성 우선 (CLAUDE.md 4.5)

  anthropic:
    model: "claude-opus-5"
    effort: "high"          # low / medium / high / xhigh / max
    # claude-opus-5 같은 최신 모델은 temperature를 아예 받지 않는다(400 오류).
    # null이면 코드가 이 항목을 보내지 않는다. 옛 모델로 바꿀 때만 1.0을 적는다.
    temperature: null
