<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>대한민국 소비 트렌드 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="data:,">
<!-- 스위스 그로테스크 한 가족: Pretendard(한글) + Helvetica Neue/Arial(라틴 폴백). 세리프·모노 없음 -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* =========================================================================
     대한민국 소비 트렌드 보드 — 스위스 타이포그래피
     흰 종이 · 검정 잉크 · 그로테스크 한 가족(Pretendard/Helvetica) · 모서리 0 · 그림자 0
     빨강은 장식이 아니라 신호에만 쓴다: 상승 배지, 활성 탭, 이번 주 한 줄의 윗괘선.
     ========================================================================= */
  :root{
    --bg:#FFFFFF;
    --card:#FFFFFF;
    --surface-2:#F2F2F2;
    --ink:#000000;
    --ink-soft:#333333;
    --ink-faint:#6B6B6B;
    --line:#D9D9D9;
    --accent:#E30613;      /* 스위스 레드 */
    --accent-soft:#F2F2F2;
    --accent-ink:#000000;   /* 라벨·숫자·칩은 검정. 빨강은 --accent 하나로 신호에만 */
    --danger:#B8000F;
    --danger-soft:#FDE7E9;
    --down:#1F4FBF;
    --shadow-card:none;
    --shadow-pop:0 0 0 1px var(--ink);
    --veil:rgba(255,255,255,.96);
    --sans:Pretendard,"Pretendard Variable","Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000; --card:#000000; --surface-2:#161616; --ink:#FFFFFF; --ink-soft:#CFCFCF;
      --ink-faint:#8C8C8C; --line:#2E2E2E; --accent:#FF3B45; --accent-soft:#161616; --accent-ink:#FFFFFF;
      --danger:#FF6B73; --danger-soft:#2A0A0D; --down:#6C93FF;
      --shadow-pop:0 0 0 1px var(--ink);
      --veil:rgba(0,0,0,.96);
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000; --card:#000000; --surface-2:#161616; --ink:#FFFFFF; --ink-soft:#CFCFCF;
    --ink-faint:#8C8C8C; --line:#2E2E2E; --accent:#FF3B45; --accent-soft:#161616; --accent-ink:#FFFFFF;
    --danger:#FF6B73; --danger-soft:#2A0A0D; --down:#6C93FF;
    --shadow-pop:0 0 0 1px var(--ink);
    --veil:rgba(0,0,0,.96);
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font-family:var(--sans); font-size:14px; line-height:1.5; letter-spacing:-.005em;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  /* 모노 대신 같은 서체의 등폭 숫자 */
  .mono{ font-family:var(--sans); font-variant-numeric:tabular-nums; letter-spacing:0; }
  h1,h2,h3,.balance{ text-wrap:balance; }
  button{ font-family:inherit; letter-spacing:inherit; }

  /* 워드마크 · 이번 주 한 줄 — 굵고 좁게. 이 페이지에서 가장 큰 목소리 */
  .wordmark{ font-weight:700; font-size:clamp(18px,2vw,22px); letter-spacing:-.03em; line-height:1; color:var(--ink); }
  .topline-card{ padding:clamp(22px,3.4vw,40px) clamp(20px,3vw,36px); }
  .topline-head{
    font-size:clamp(30px,4.4vw,56px); font-weight:700; line-height:1.04; letter-spacing:-.035em;
    text-wrap:balance; word-break:keep-all; overflow-wrap:break-word; margin:0;
  }
  .topline-body{ font-size:14.5px; line-height:1.7; color:var(--ink-soft); word-break:keep-all; overflow-wrap:break-word; margin:0; max-width:64ch; }
  .verse{ white-space:pre-line; }
  .idea-card{ cursor:pointer; transition:border-color .12s ease; }
  .idea-card.is-open{ border-color:var(--ink); }
  .idea-collapsed-row{ display:flex; align-items:center; gap:10px; padding:16px 20px; }
  .topline-grid{ display:grid; grid-template-columns:1fr; gap:18px; }
  .topline-col{ min-width:0; display:flex; flex-direction:column; }
  @media (min-width:880px){
    .topline-grid{ grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); column-gap:clamp(28px,3.4vw,56px); gap:0; }
    .topline-col-a{ justify-content:space-between; }
    .topline-col-b{ border-left:1px solid var(--line); padding-left:clamp(24px,3vw,44px); }
  }

  ::selection{ background:var(--ink); color:var(--bg); }
  input,textarea{ caret-color:var(--accent); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  *{ scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border:3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover{ background:var(--ink-faint); }

  .card{ background:var(--card); border:1px solid var(--ink); border-radius:0; box-shadow:none; }

  /* ---------- 마스트헤드: 흰 바탕, 검정 괘선 하나 ---------- */
  .masthead{ position:sticky; top:0; z-index:30; background:var(--veil); border-bottom:1px solid var(--ink); }
  /* 좁은 화면: 한 줄로 낮게. 인라인 스타일을 덮어야 해서 !important */
  @media (max-width:720px){
    .masthead > div{ flex-wrap:nowrap !important; padding:10px 16px !important; gap:10px !important; }
    .wordmark{ font-size:16px; }
    .wordmark + span{ display:none !important; } /* 주차 칩은 전광판·기록 탭에 이미 있다 */
    .masthead .btn{ white-space:nowrap; padding:8px 12px; font-size:13px; }
  }

  /* ---------- 전광판 ---------- */
  .ticker{ background:var(--bg); border-bottom:1px solid var(--ink); overflow:hidden; }
  /* 위: 카테고리 줄(흰 바탕, 넉넉한 높이, 아래 괘선) / 아래: 순위 줄(회색 바탕). 두 층이 갈려 보여야 한다 */
  .ticker-head{
    text-align:center; padding:12px 0 10px; font-size:14px; font-weight:700; letter-spacing:-.01em; color:var(--ink);
    border-bottom:1px solid var(--line);
    animation:ticker-in .5s cubic-bezier(.2,.7,.2,1);
  }
  .ticker-src{ font-weight:400; color:var(--ink-faint); }
  .ticker-row{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); background:var(--surface-2); }
  .ticker-slot{ overflow:hidden; height:40px; padding:0 16px; border-left:1px solid var(--line); }
  .ticker-slot:first-child{ border-left:none; }
  .ticker-item{
    display:flex; align-items:center; gap:8px; height:40px; font-size:13px; line-height:1; white-space:nowrap; min-width:0;
    animation:ticker-in .5s cubic-bezier(.2,.7,.2,1);
  }
  .ticker-rank{ font-size:12px; font-weight:700; color:var(--ink); flex-shrink:0; }
  .ticker-title{ font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .ticker-move{ font-size:11.5px; font-weight:700; flex-shrink:0; margin-left:auto; padding-left:6px; }
  .ticker-move.is-up{ color:var(--accent); }
  .ticker-move.is-down{ color:var(--down); }
  .ticker-move.is-same{ color:var(--ink-faint); }
  .ticker-move.is-new{ color:var(--ink); }
  @keyframes ticker-in{ from{ transform:translateY(100%); opacity:0; } to{ transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .ticker-item, .ticker-head{ animation:none; } }
  @media (max-width:900px){ .ticker-row{ grid-template-columns:repeat(2,minmax(0,1fr)); } .ticker-slot:nth-child(n+3){ display:none; } }

  /* ---------- 랭킹 그리드 ---------- */
  .rank-grid{ display:grid; }
  .grid-head-cell{
    padding:12px 12px 9px; font-weight:700; font-size:13px; letter-spacing:-.01em; color:var(--ink); text-align:left;
    border-bottom:1px solid var(--ink); position:relative;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end;
  }
  .grid-head-cell > .grid-head-src{ width:100%; }
  .grid-head-src{
    height:13px; margin-top:2px; font-size:10.5px; font-weight:400; color:var(--ink-faint); text-align:left;
    opacity:0; transition:opacity .12s ease; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .grid-head-cell:hover .grid-head-src{ opacity:1; }
  @media (hover:none){ .grid-head-src{ opacity:.75; } }
  .grid-head-cell .manual-input{ text-align:left; }
  .grid-group-cell{
    padding:14px 12px 12px; text-align:left; font-size:15px; font-weight:700; letter-spacing:-.02em;
    color:var(--ink-faint); background:var(--bg); border-bottom:1px solid var(--line);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .grid-group-cell + .grid-group-cell{ border-left:1px solid var(--line); }
  .grid-group-cell.has-read{ cursor:pointer; color:var(--ink); font-weight:700; }
  .grid-group-cell.has-read:hover{ background:var(--surface-2); }
  .grid-group-mark{ display:inline-block; width:8px; height:8px; background:var(--accent); margin-left:8px; vertical-align:2px; }

  /* 카테고리 해석 마퀴 — 표 바로 위 한 줄. 9개 헤드라인이 왼쪽으로 흐른다. 커서를 올리면 멈춘다 */
  .marquee{
    overflow:hidden; height:56px; margin:6px 0 18px;
    border-top:1px solid var(--ink); border-bottom:1px solid var(--ink); background:var(--bg);
    mask-image:linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
  }
  .marquee-track{
    display:flex; width:max-content; height:56px; align-items:center;
    animation:marquee calc(var(--n, 9) * 7s) linear infinite; /* 그룹당 7초 */
  }
  .marquee:hover .marquee-track{ animation-play-state:paused; }
  .marquee-item{
    display:flex; align-items:center; gap:12px; padding:0 28px; height:56px; white-space:nowrap;
    background:transparent; border:none; border-right:1px solid var(--line); color:var(--ink); cursor:pointer; line-height:1;
  }
  .marquee-item b{ font-size:13px; font-weight:700; color:var(--ink-faint); }
  .marquee-item span{ font-size:clamp(17px,2vw,22px); font-weight:700; letter-spacing:-.03em; }
  .marquee-item:hover span{ text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:2px; }
  @keyframes marquee{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  @media (prefers-reduced-motion: reduce){ .marquee-track{ animation:none; } .marquee{ overflow-x:auto; mask-image:none; -webkit-mask-image:none; } }
  @media (max-width:720px){ .marquee, .marquee-track, .marquee-item{ height:46px; } .marquee-item{ padding:0 16px; gap:8px; } .marquee-item span{ font-size:15px; } }

  .grid-cell{
    display:flex; align-items:flex-start; width:100%; height:100%; min-height:72px;
    padding:25px 12px 12px; border-bottom:1px solid var(--line); text-align:left;
    background:transparent; border-left:none; border-right:none; border-top:none;
    color:var(--ink); cursor:pointer; position:relative; transition:background-color .12s ease;
  }
  .grid-cell:not(:last-child){ border-right:1px solid var(--line); }
  .grid-cell.is-empty{ cursor:default; color:var(--ink-faint); }
  .grid-cell.is-hoverable:hover{ background:var(--surface-2); }
  .grid-cell.is-selected{ background:var(--accent-soft); box-shadow:inset 3px 0 0 0 var(--accent); }
  .grid-cell.is-dim{ opacity:.35; }
  .grid-cell.is-variant-echo::after{
    content:""; position:absolute; inset:3px; border:2px solid var(--accent); pointer-events:none;
  }
  .rank-cell{
    display:flex; align-items:flex-start; font-size:22px; font-weight:700; letter-spacing:-.04em; line-height:1; color:var(--ink);
    padding:22px 8px 12px; border-bottom:1px solid var(--line); border-right:1px solid var(--ink); justify-content:flex-end;
    position:sticky; left:0; z-index:6; background:var(--card); font-variant-numeric:tabular-nums;
  }
  .grid-corner{ position:sticky; left:0; z-index:7; background:var(--card); border-bottom:1px solid var(--ink); border-right:1px solid var(--ink); }
  .grid-group-corner{ position:sticky; left:0; z-index:7; background:var(--bg); border-bottom:1px solid var(--line); border-right:1px solid var(--ink); }
  .cell-title{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:14px; font-weight:500; line-height:1.3; letter-spacing:-.01em; }
  .cell-artist{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .hl{ background:linear-gradient(transparent 62%, var(--accent-soft) 62%); color:inherit; padding:0 1px; font-weight:600; }
  .rank-move{
    position:absolute; top:7px; left:10px; z-index:2;
    display:inline-flex; align-items:center; font-size:10.5px; font-weight:700;
    letter-spacing:0; font-variant-numeric:tabular-nums; pointer-events:none; line-height:1.2;
  }
  .rank-move.is-up{ color:var(--accent); }
  .rank-move.is-down{ color:var(--down); }
  .rank-move.is-same{ color:var(--ink-faint); font-weight:500; }
  .rank-move.is-new{ color:var(--bg); background:var(--ink); padding:1px 5px; font-size:9.5px; letter-spacing:.02em; }
  .sel-badge{
    position:absolute; top:6px; right:6px; width:19px; height:19px;
    background:var(--ink); color:var(--bg); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }

  /* ---------- 좁은 화면용 표: 카테고리 탭 + 세로 한 열 ---------- */
  .mobile-chart{ overflow:hidden; }
  .cat-strip{ display:flex; gap:0; overflow-x:auto; border-bottom:1px solid var(--ink); scrollbar-width:none; }
  .cat-strip::-webkit-scrollbar{ display:none; }
  .cat-chip{
    flex-shrink:0; padding:11px 14px; font-size:13px; font-weight:500; color:var(--ink-faint);
    background:transparent; border:none; border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap;
  }
  .cat-chip.is-on{ color:var(--ink); font-weight:700; border-bottom-color:var(--accent); }
  .mobile-read{
    display:block; width:100%; text-align:left; padding:12px 14px; background:var(--surface-2);
    border:none; border-bottom:1px solid var(--line); font-size:14px; font-weight:700; letter-spacing:-.02em; color:var(--ink);
    cursor:pointer; line-height:1.35; word-break:keep-all;
  }
  .mobile-read-group{ display:block; font-size:11px; font-weight:400; color:var(--ink-faint); margin-bottom:2px; letter-spacing:0; }
  .mobile-row{ display:grid; grid-template-columns:52px minmax(0,1fr); }
  .mobile-row .rank-cell{ position:static; }
  .mobile-row .grid-cell{ min-height:64px; }
  .mobile-row .grid-cell:not(:last-child){ border-right:none; }

  @keyframes shimmer{ 0%{ background-position:-200% 0; } 100%{ background-position:200% 0; } }
  .shimmer{
    background:linear-gradient(90deg, var(--surface-2) 25%, var(--line) 45%, var(--surface-2) 65%);
    background-size:200% 100%; animation:shimmer 1.4s ease-in-out infinite; height:14px; width:80%;
  }
  @media (prefers-reduced-motion: reduce){ .shimmer{ animation:none; background:var(--surface-2); } }

  /* ---------- 칸 팝업 ---------- */
  .reason-pop{
    position:fixed; width:340px; max-height:420px; overflow:hidden; z-index:50;
    background:var(--card); border:1px solid var(--ink); box-shadow:none;
    padding:16px 18px 16px; opacity:0; transform:translateY(4px); pointer-events:none;
    transition:opacity .12s ease, transform .12s ease;
  }
  .reason-pop.is-open{ opacity:1; transform:translateY(0); pointer-events:auto; }
  @media (prefers-reduced-motion: reduce){ .reason-pop{ transition:none; } }
  .chip{
    display:inline-flex; align-items:center; font-size:12px; font-weight:500; color:var(--ink);
    border:1px solid var(--line); padding:3px 8px; margin:0 6px 6px 0;
  }
  .reason-row{ display:flex; gap:12px; padding:9px 0; border-top:1px solid var(--line); }
  .reason-row:first-of-type{ border-top:none; }
  .reason-rank{ font-size:12px; font-weight:700; color:var(--ink); width:20px; flex-shrink:0; margin-top:2px; font-variant-numeric:tabular-nums; }

  /* ---------- 그룹 해석 모달 ---------- */
  .read-modal-backdrop{
    position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .read-modal{ width:min(680px,100%); max-height:86vh; overflow-y:auto; padding:28px 32px 26px; }

  /* ---------- 묶음 추론 손패 ---------- */
  .hand{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; perspective:1200px; }
  .hand-card{ position:relative; aspect-ratio:3/4; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.7,.2,1); cursor:pointer; }
  .hand-card:hover{ transform:translateY(-4px); }
  /* 호버 = 반전 */
  .hand-card:hover .hand-front{ background:var(--ink); color:var(--bg); }
  .hand-card:hover .hand-front .hand-fb, .hand-card:hover .hand-front .hand-hint{ color:var(--bg); opacity:.7; }
  .hand-card.is-flipped{ transform:rotateY(180deg); }
  .hand-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border:1px solid var(--ink); background:var(--card);
    display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; gap:6px; padding:16px; text-align:left;
  }
  .hand-back{ transform:rotateY(180deg); background:var(--ink); color:var(--bg); }
  .hand-title{ font-size:clamp(20px,2.4vw,30px); font-weight:700; letter-spacing:-.035em; line-height:1.05; word-break:keep-all; }
  .hand-fb{ font-size:11px; font-weight:500; color:var(--ink-faint); }
  .hand-hint{ position:absolute; top:12px; left:16px; font-size:11px; color:var(--ink-faint); opacity:0; transition:opacity .12s ease; }
  .hand-card:hover .hand-hint{ opacity:1; }
  .hand-card.is-rated-up .hand-front{ border-top:3px solid var(--accent); }
  .hand-card.is-rated-down .hand-front{ opacity:.45; }
  @media (max-width:720px){ .hand{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; } }
  @media (prefers-reduced-motion: reduce){ .hand-card{ transition:none; } }

  /* ---------- 선택 바 ---------- */
  .selection-bar{
    position:sticky; bottom:16px; z-index:35; margin-top:16px;
    background:var(--ink); color:var(--bg); box-shadow:none;
    padding:12px 12px 12px 20px; display:flex; align-items:center; gap:14px;
    transform:translateY(0); transition:transform .18s ease, opacity .18s ease;
  }
  .selection-bar.is-hidden{ transform:translateY(90px); opacity:0; pointer-events:none; }

  .btn{ border-radius:0; font-weight:700; font-size:14px; letter-spacing:-.01em; padding:11px 18px; transition:transform .08s ease, background-color .12s ease, opacity .12s ease; cursor:pointer; border:none; }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ cursor:default; opacity:.4; }
  .btn-primary{ background:var(--ink); color:var(--bg); }
  .btn-primary:hover:not(:disabled){ background:var(--accent); }
  .btn-ghost{ background:var(--surface-2); color:var(--ink); }
  .btn-ghost:hover:not(:disabled){ background:var(--line); }
  .btn-line{ background:transparent; color:var(--ink); border:1px solid var(--ink); }
  .btn-line:hover:not(:disabled){ background:var(--surface-2); }
  .btn-pill-white{ background:rgba(255,255,255,.16); color:var(--bg); }
  .btn-pill-white:hover:not(:disabled){ background:rgba(255,255,255,.28); }

  /* ---------- 묶음 모달 안 ---------- */
  .bundle-x{ flex-shrink:0; margin-left:auto; width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    border:none; background:transparent; color:var(--ink-faint); font-size:18px; line-height:1; cursor:pointer; }
  .bundle-x:hover{ color:var(--accent); }
  .bundle-item-chip{ display:flex; align-items:baseline; gap:8px; padding:7px 10px; border:1px solid var(--line); font-size:13px; }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,8px); z-index:60;
    background:var(--ink); color:var(--bg); font-size:13.5px; font-weight:500; padding:11px 18px;
    opacity:0; transition:opacity .16s ease, transform .16s ease; pointer-events:none;
  }

기보다 이미 검증된 곡으로 돌아가는 선택이 겹쳤기 때문이다.","title":"BiiiG"},{"itemId":"c1-3","note":"한 팀 곡 세 개가 동시에 걸린 건 타이틀곡만 듣고 넘어가지 않고 앨범 전체를 순서대로 반복해 듣는 선택이 만든 결과다.","title":"LOVE ATTACK"},{"itemId":"c1-8","note":"레이블·컴백 홍보 없이도 이름 하나로 판단을 맡기는 선택이 신인 대신 이미 익숙한 이름을 골랐다.","title":"FALLEN ANGEL"}]},{"group":"OTT","headline":"열 자리가 그대로 굳었다","popHead":"안 갈아타고 끝까지 본다","summary":"1위 Mousetrap부터 10위 포핸즈까지 TOP10 전원이 지난주와 같은 순위를 유지했고 새로 진입한 항목은 없다. 3위 I am Solo와 6위 I'm SOLO, Love goes on 이 함께 자리를 지켰고, 10위 포핸즈는 케이블 TV 1위에도 동시에 올랐다.","points":["1위 Mousetrap부터 9위 My Secretary: My Genie Secretary까지 TOP10 전원이 지난주 자리를 그대로 지켰고 새로 들어온 제목이 하나도 없다. 지금까지 본 이야기를 중간에 놓치지 않으려는 완주 심리가 다음 화를 계속 켜게 만드는 것이므로, 광고는 신작 런칭보다 이미 진행 중인 시즌의 협찬 갱신에 먼저 붙어야 한다.","3위 I am Solo와 6위 I'm SOLO, Love goes on 이 나란히 자리를 지킨 건 본편 하나가 아니라 같은 포맷을 찾는 습관이 프랜차이즈 전체로 뻗어 있다는 뜻이다. 본편에서 못 채운 애착을 스핀오프로 옮겨 계속 붙잡아두는 구조이므로, 한 번의 협찬 계약으로 본편·스핀오프 두 슬롯에 동시에 노출을 걸 수 있다.","10위 포핸즈는 케이블 TV 1위에도 함께 올라, 편성 시간에 채널을 틀어놓고 보던 습관이 넷플릭스 재생으로 그대로 이어졌다. 방영 중 편성물에 얹는 광고는 반응이 이미 검증된 뒤 들어가는 것이라 신작에 거는 베팅보다 회수 리스크가 낮다.","이번 주는 신작 제작발표 협찬을 새로 찾기보다, TOP10에 이미 자리 잡은 시즌·스핀오프 중 다음 화 방영이 예정된 작품의 PPL·협찬 갱신 여부부터 점검하라."],"keywords":["완주심리","습관시청","프랜차이즈연장","교차편성","저위험협찬"],"anomalies":[{"itemId":"c3-10","note":"케이블 TV 1위와 겹쳐 있어, 정해진 시간에 채널을 틀어놓고 보던 습관이 넷플릭스 재생으로 그대로 옮겨간 자리로 보인다.","title":"포핸즈"},{"itemId":"c3-6","note":"본편(3위)이 있는데도 스핀오프가 따로 자리를 지킨 건, 같은 포맷을 찾는 습관이 한 프로그램이 아니라 프랜차이즈 전체를 향해 있다는 뜻이다.","title":"I'm SOLO, Love goes on"},{"itemId":"c3-1","note":"제목이 영어 표기로만 남아 있어 이 데이터만으로는 실제 콘텐츠 정체를 가릴 수 없다.","title":"Mousetrap"}]},{"group":"영화","headline":"극장가 순위, 그대로 굳었다","popHead":"도전자 없는 스크린 한 주","summary":"오디세이(1위)부터 인턴(10위)까지 영화 상위 10개 전부가 지난주 순위를 그대로 지켰고 새 진입은 없었다. 오디세이는 영화 1위이면서 동시에 도서 5위에도 이름을 올려 두 차트를 가로지른다. 새 개봉작이 상위권을 흔들지 못한 한 주다.","points":["오디세이부터 인턴까지 열 편 전부가 지난주 자리를 그대로 지킨 건 새로 볼 것이 없어 이미 고른 영화를 이어보거나 미뤄둔 관람을 채운 결과로 읽힌다. 극장은 이번 주만큼은 신작 개봉 마케팅비 대신 기존 상영작의 회차 확대와 재관람 할인에 쓰는 편이 낫다.","오디세이가 영화 1위이면서 동시에 도서 5위에도 오른 건, 결말이 이미 알려진 고전 서사를 고른 관객이 영화만으로 끝내지 않고 원작을 찾아 확인까지 하는 소비로 이어졌다는 뜻이다. 서점은 영화 개봉 기간에 맞춰 오디세이 관련 도서를 매대 전면에 걸고 극장 매표소와 엮은 할인 쿠폰을 붙일 수 있다.","스파이더맨: 브랜드 뉴 데이가 2위를 그대로 지킨 건, 익숙한 캐릭터의 다음 이야기라 크게 벗어나지 않을 거라는 확신이 개봉 이후 관람도 붙잡아 뒀기 때문이다. 편의점·카페 콜라보 상품의 판매 주기를 개봉 첫 주에 끊지 말고 한두 주 더 끌고 가도 재고가 남지 않는다.","사랑의 하츄핑과 명탐정 코난이 하위권에서 나란히 자리를 지키는 건 주말 가족 나들이라는 고정된 시간대 소비 때문이다. 브랜드는 이번 주말 한정으로 이 두 타이틀과 엮은 키즈 세트 메뉴나 캐릭터 굿즈 번들을 바로 걸어라."],"keywords":["관성소비","안전한선택","원작연계","시간대고정","재관람유도"],"anomalies":[{"itemId":"c2-1","note":"결말이 이미 알려진 원작 서사를 고른 관객이 영화 관람 뒤에 원작 도서까지 찾아본 것으로 보인다.","title":"오디세이"},{"itemId":"c2-2","note":"익숙한 캐릭터가 이어가는 다음 이야기라는 확신이 개봉 이후에도 관람을 계속 붙잡아 둔다.","title":"스파이더맨: 브랜드 뉴 데이"},{"itemId":"c2-8","note":"주말 가족 나들이라는 고정된 시간대 소비가 이 항목을 계속 붙잡아 둔다.","title":"사랑의 하츄핑: 고래보석의 전설"}]},{"group":"TV","headline":"채널은 그대로, 화제는 딴 데서 산다","popHead":"리모컨은 안 움직여도 검색창은 움직인다","summary":"지상파 TV 10개 항목 전원과 케이블 TV 9개 항목이 지난주와 같은 순위를 지켰다. 케이블의 유일한 신규 진입은 신병4사보타주(3위)다. 케이블 1위 포핸즈는 넷플릭스 10위에도, 케이블 7위 나는SOLO는 유튜브 검색 3위에도 함께 이름을 올렸다.","points":["지상파 10개 항목 전원이 순위를 그대로 지킨 것은 정해진 시간에 정해진 채널을 트는 습관이 흔들리지 않았다는 뜻이다 — 이 지면은 매주 새로 입찰할 이유가 없으니 분기 단위 선구매로 단가를 고정하는 쪽이 유리하다.","케이블 1위 포핸즈가 넷플릭스 10위에도 걸린 것은 본방을 놓칠까 봐 그 주 안에 OTT로 채워 보는 사람들이 있다는 뜻이다 — 편성 직후 며칠은 두 창구의 트래픽이 겹치는 구간이니 같은 주에 다시보기 프로모션을 붙이면 도달을 한 번에 묶을 수 있다.","케이블 7위 나는SOLO가 유튜브 검색 3위에도 오른 것은 방송을 본 뒤 인물과 전개를 검색해 다음 대화에 끼려는 행동이 이어진다는 뜻이다 — 방영 직후 몇 시간이 검색이 몰리는 구간이므로 그 창을 겨눈 클립·요약형 광고가 방송 광고보다 도달이 크다.","신병4사보타주가 케이블 3위로 새로 들어온 것은 낯선 이야기를 고른 게 아니라 인물과 규칙을 이미 아는 시리즈로 돌아온 선택이다 — 신작보다 기존 시즌의 몰아보기 상품에 광고를 붙이는 쪽이 반응을 예측하기 쉽다.","케이블 상위권이 다른 플랫폼 상위권과 겹치는 이번 같은 주에는, 방송 편성 시간이 아니라 그 콘텐츠의 검색·재생이 몰리는 시간대에 맞춰 광고 노출을 재배치하라."],"keywords":["크로스플랫폼","편성습관","정주행수요","검색피크","시즌귀환"],"anomalies":[{"itemId":"c7-3","note":"새 이야기가 아니라 인물과 결말을 이미 아는 시리즈로 안전하게 돌아온 선택이 만든 자리다","title":"신병4사보타주"},{"itemId":"c7-1","note":"본방을 놓칠까 봐 그 주 안에 OTT로 채워 보려는 수요가 겹쳐서 생긴 자리다","title":"포핸즈"},{"itemId":"c7-7","note":"방송 직후 인물과 전개를 검색해 대화에 끼려는 행동이 이어져서 생긴 자리다","title":"나는SOLO"}]},{"group":"유튜브","headline":"영상은 쏠리고 검색은 멈췄다","popHead":"발매는 새로워도 검색은 낡았다","summary":"유튜브 영상 TOP10은 7위 '지금 기분이 어때요?'를 뺀 9개가 지난주 차트에 없던 신규 진입이다. JISOO의 'CLICK' 본편(1위)과 티저(3위), JENNIE의 'FALLEN ANGEL'(2위)과 'HEAVEN' 라이브(9위)가 각각 두 자리씩 채웠고, 김어준의 뉴스공장은 9월 1·2·3일 세 회차(6·8·10위)가 동시에 올랐다. 반대로 유튜브 검색 TOP10은 열 자리 전부 지난주와 같은 순위를 지켰다.","points":["영상 차트 아홉 자리가 한 주 만에 통째로 갈렸다는 것은 이번 주에 몰린 컴백('CLICK'·'FALLEN ANGEL'·'Skibidi'·'Bloody Paradise') 중 하나라도 놓치면 초동에서 밀린다는 감각이 시청을 특정 며칠에 몰아넣었다는 뜻이고, 광고주는 상시 프리롤 예산을 분산하기보다 확정된 컴백 주간에 매체비를 집중 배분해야 노출 단가를 아낀다.","JISOO는 본편과 티저가, JENNIE는 본편과 라이브 클립이 나란히 순위에 오른 것은 하나의 발매를 형식만 바꿔 가며 놓치지 않고 챙기는 소비이며, 같은 컴백 안에서 티저·본편·라이브 클립마다 브랜드 노출을 나눠 붙이면 한 번의 계약으로 노출 지점을 늘릴 수 있다.","김어준의 뉴스공장이 하루 간격 세 회차(6·8·10위)로 동시에 올라오는 것은 그날 화제보다 정해진 방송 시간에 맞춰 챙겨보는 소비라서, 매주 갈아치우는 캠페인보다 분기 단위로 고정 붙이는 프리롤이 단가 대비 도달을 더 안정적으로 준다.","유튜브 검색 TOP10 열 자리가 지난주와 그대로인 것은 새 화제를 찾기보다 이미 따라가던 이야기('나는 solo'·'피의자'·'윤종훈')를 다음 회차 확인하듯 반복해서 찾아본 것이라, 이런 검색어는 주간 재입찰 없이 캠페인 기간 내내 같은 입찰가로 묶어 둬도 노출이 새지 않는다.","상시로 나눠 쓰던 유튜브 프리롤 예산을 이번 주처럼 컴백이 몰리는 특정 주간으로 재배치하고, 컴백 확정 일정표를 기준으로 분기 매체 캘린더를 미리 짜 두라."],"keywords":["발매집중","포맷분산","편성습관","고정검색어","초동사수"],"anomalies":[{"itemId":"c4-6","note":"매일 방송 시간에 맞춰 챙겨보는 습관이 정치 시사 프로그램 회차를 연달아 차트에 올린다.","title":"김어준의 겸손은힘들다 뉴스공장 2026년 9월 1일 화요일 [이원상, 겸손NSC, 홍사훈X주진우X봉지욱X노종면, 복덕위원회, 겸손공장(세종잉크)] + 텐밀희"},{"itemId":"c4-3","note":"본편 공개 전 예고편까지 챙겨야 놓치지 않는다는 감각이 같은 컴백의 티저도 별도로 끌어올린다.","title":"JISOO"},{"itemId":"c5-3","note":"정해진 요일에 새 회차를 확인하는 습관이 검색어를 매주 같은 자리에 묶어 둔다.","title":"나는 solo"}]},{"group":"공연·전시","headline":"뮤지컬만 통째로 새 얼굴","popHead":"예매 오픈일이 곧 순위표","summary":"콘서트는 무명전설 전국투어(1위)·JIN YOUNG 팬미팅(3위)·위켄드 슈퍼콘서트(4위)·그랜드 민트 페스티벌(5위)·찰리 푸스(7위)·이슬라이브(9위) 여섯 자리가 지난주 그대로다. 전시도 경복궁 야간관람(1위)·캐스크 카니발(3위)·생명의 기원(4위)·부산불꽃축제(5위)·지브리展(8위)·창경궁 궁궐야행(9위)이 그대로 남았다. 반면 뮤지컬은 10자리 전부가 신규 진입이고, 그중 드라큘라가 서울(2위)·대구(10위) 두 자리를 동시에 차지했다.","points":["무명전설 전국투어(1위)·경복궁 야간관람(1위)처럼 매주 같은 자리를 지키는 항목은 새로 고민해서 고르는 게 아니라 이미 잡아둔 일정을 그대로 따라가는 선택이라, 이 자리는 단발 홍보보다 회차권·시즌패스 같은 반복 결제 상품에서 돈이 난다.","뮤지컬 10자리가 전부 새 얼굴로 바뀐 건 관객이 매주 다시 비교해서 고른 결과라기보다 예매가 막 열린 쪽으로 몰린 결과에 가깝다. 〈디어 에반 핸슨〉〈엘리자벳〉처럼 오픈 직후 상위권에 오르는 흐름을 잡으려면 티켓 오픈일에 노출을 몰아줘야 한다.","드라큘라가 서울(2위)과 대구(10위)를 동시에 차지한 건 같은 내용을 어디서든 볼 수 있으면 굳이 서울 회차를 기다리지 않는다는 뜻이라, 지방 동시 오픈이 서울 매출을 깎지 않고 전체 판을 키운다.","스페인 미술 500년(2위)의 '라스트 얼리버드', 웨인티보 전(6위)과 부천국제만화축제(7위)의 '얼리버드' 표기는 내용이 아니라 마감 시점이 클릭을 만든 사례라, 세 건 모두 티켓값이 오르기 전에 사두려는 움직임으로 읽힌다.","상시 판매 중인 공연·전시 티켓에도 '이번 주까지'·'한정 수량' 같은 마감 표시를 붙여 지금 아니면 놓친다는 신호를 인위적으로 만들어라."],"keywords":["마감효과","오픈쏠림","습관관성","지역분산수요","시즌물갈이"],"anomalies":[{"itemId":"c8-2","note":"드라큘라 서울 공연은 대구 동시 상영 속에서도 수도권 접근성이 우선 선택으로 이어진 자리다.","title":"뮤지컬 드라큘라 (Dracula：The Musical)"},{"itemId":"c9-2","note":"옥토버페스트는 무대를 보러 가는 선택이 아니라 가서 즐기는 체험을 사는 선택이 콘서트 랭킹에 얹힌 경우다.","title":"옥토버페스트 서울 2026 일반석"},{"itemId":"c10-2","note":"스페인 미술 500년은 전시 내용보다 '라스트 얼리버드'라는 마감 문구가 진입을 만든 자리다.","title":"［라스트 얼리버드］ 스페인 미술 500년: 빛과 어둠의 연대기"}]},{"group":"앱·게임","headline":"게임은 멈추고 행정앱만 움직였다","popHead":"습관은 그대로, 서류만 바빴다","summary":"구글 플레이 앱 상승률 목록은 1위 국세청 홈택스부터 10위 하나은행 하나원큐까지 10개 전부 지난주 차트에 없던 신규 진입이며, 그중 다수가 정부24(4위)·건강보험25시(3위)·대한민국 모바일 신분증(9위) 같은 행정 인증 앱이다. 반면 게임은 1위 리그 오브 레전드부터 10위 아이온2까지 지난주와 순위가 하나도 바뀌지 않았다.","points":["구글 플레이 앱 상승률 1위 국세청 홈택스, 3위 건강보험25시, 4위 정부24, 9위 대한민국 모바일 신분증까지 상위권 절반이 행정 인증 앱으로 채워진 것은 원해서 켠 화면이 아니라 놓치면 불이익을 보는 확인·신고 절차를 처리하려 켠 화면이라는 뜻이다. 이런 주에는 세무·보험 관련 금융 상품이나 안내 배너를 그 확인 화면 옆에 붙이는 것이 평소보다 눈에 띈다.","5위 마이케이티, 6위 경기지역화폐, 7위 케이뱅크, 8위 우리동네GS, 10위 하나은행 하나원큐가 함께 오른 것은 지역화폐를 계좌에 연동해 편의점 같은 근거리 매장에서 바로 쓰려는 한 동선이 여러 앱에 걸쳐 순서대로 실행됐다는 뜻이다. 지역화폐 가맹점인 편의점 쪽에는 이 주간에 즉시소비형 프로모션을 걸 여지가 생긴다.","행정·금융 앱 9개 사이에서 2위 올리브영만 유일하게 쇼핑 성격인데, 이는 뷰티 카테고리도 이번 주 마감이 걸린 혜택이나 포인트를 놓치지 않으려는 확인성 접속이었을 가능성을 보여준다. 마감 임박 알림을 보낸 브랜드일수록 이런 주에 접속을 끌어올 여지가 크다.","게임 10개는 1위 리그 오브 레전드부터 10위 아이온2까지 지난주 순서를 하나도 바꾸지 않았는데, 이는 이 카테고리 이용자들이 새로 뭘 고를 필요 없이 이미 켜 둔 게임으로 그대로 돌아갔다는 뜻이다. 신작 마케팅보다 기존 유저를 붙잡는 인앱 이벤트에 이번 주 게임 광고비를 거는 편이 맞다.","지역화폐·간편결제·통신사 앱이 한 주에 몰려 오른 만큼, 브랜드는 세금·보험 확인 화면에 뜨는 안내 뒤에 자사 결제 수단이나 지역화폐 가맹 혜택 알림을 바로 붙여 그 자리에서 결제로 넘어오게 만들어라."],"keywords":["마감압박","인증동선","절차소비","습관고착","근거리소비"],"anomalies":[{"itemId":"c17-1","note":"국세청 홈택스가 1위인 것은 원해서라기보다, 스스로 세금이나 지원 자격을 놓치지 않고 확인해야 하는 마감성 절차 때문으로 보인다.","title":"국세청 홈택스 [손택스]National Tax Service, Korea"},{"itemId":"c17-9","note":"대한민국 모바일 신분증은 한 번 등록해 두면 이후 여러 인증을 앱 화면 하나로 끝낼 수 있다는 이유로, 이번에 그 등록을 마쳐 두려는 접속으로 보인다.","title":"대한민국 모바일 신분증행정안전부"},{"itemId":"c18-10","note":"아이온2가 새 이벤트 없이도 10위를 지킨 것은 이미 설치해 둔 이용자들이 굳이 다른 게임으로 옮겨 갈 이유를 못 느꼈다는 뜻이다.","title":"아이온2"}]},{"group":"출판·웹툰","headline":"스크린이 서가로 번진 한 주","popHead":"웹툰은 멈추고 서가만 흔들렸다","summary":"도서 5위에 새로 오른 '오디세이아(고대 그리스어 완역본)'은 같은 주 영화 1위 작품과 겹친다. 도서 1위 '한국사 이상현상 연구원(일반판)'도 지난주 차트에 없다가 순위를 밟지 않고 곧장 1위로 들어왔다. 반면 네이버 웹툰은 1위부터 10위까지 전주와 하나도 다르지 않다.","points":["오디세이아(고대 그리스어 완역본)이 도서 5위에 새로 오른 주는 같은 작품이 영화 1위에 오른 주와 겹친다. 화면으로 먼저 본 이야기를 원문으로 다시 확인하려는 선택이라, 개봉 기간과 맞춘 원작 매대는 티켓 예매와 별개로 돈이 된다.","한국사 이상현상 연구원(일반판)은 순위를 단계별로 밟지 않고 곧장 1위로 들어왔고, '일반판'이라는 표기는 다른 판형이 따로 있다는 뜻이다. 출간일에 미리 확보해 둔 예약 물량이 한꺼번에 잡힌 결과로 읽히며, 한정판·특전판을 따로 여는 편이 초판 매출을 더 끌어올린다.","네이버 웹툰은 1위부터 10위까지 전주와 완전히 같다. 독자가 매주 새로 고르는 게 아니라 이미 정해 둔 연재작을 그대로 이어보고 있다는 뜻이라, 새 순위 경쟁보다 기다리면무료·정기결제 같은 지속 결제 상품이 이 카테고리의 실제 매출선이다.","도서 10자리 중 8자리가 지난주 그대로고 새 얼굴은 1위·5위 두 곳뿐이다. 이 카테고리는 매주 조금씩 흔들리는 게 아니라 출간일·외부 개봉 같은 특정 계기가 있을 때만 순위가 바뀌므로, 그 계기가 있는 주에만 노출을 몰아주는 편이 상시 매대보다 효율적이다.","서점은 영화 개봉 기간에 맞춰 오디세이아 완역본을 원작 확인 코너로 옮기고, 한국사 이상현상 연구원 한정판 재고를 이번 주 안에 확인해 후속 예약을 다시 열어라."],"keywords":["원작소비","사전예약","한정판","구독관성","리텐션","개봉연계"],"anomalies":[{"itemId":"c11-1","note":"어느 자리를 밟고 올라온 순위가 아니라, 정해진 출간일에 미리 확보해 둔 물량이 한꺼번에 잡힌 결과로 읽힌다.","title":"한국사 이상현상 연구원(일반판)"},{"itemId":"c11-5","note":"고대 그리스어 완역본이라는 표기는 요약본이 아니라 근거가 되는 원문을 갖고 싶어 하는 독자를 가리키며, 그 수요가 하필 영화가 1위에 오른 주와 맞물렸다.","title":"오디세이아(고대 그리스어 완역본)"}]},{"group":"패션·리테일","headline":"명품 위탁만 새 시즌 물량이 도착했다","popHead":"멈춘 매대 옆에서 명품만 풀렸다","summary":"무신사·KREAM 톱10은 열 자리 모두 지난주와 순위가 같다. 렉스몬드는 지난주 9위 한 자리에 몰려 있던 몬클레르 품목들이 이번 주 Bady 2위·Lans 6위·Igelhood 7위·Abbadia 8위로 갈라지고 Maya70만 9위에 남았고, Jente도 지난주 10위였던 프라다 품목이 1·6·7·8위로, 9위였던 미우미우 품목이 2·3·4·5위로 갈라졌다. 렉스몬드 프라다 리나일론 블루종(5위)은 Jente 프라다 5개 품목과 동시에 잡힌다.","points":["렉스몬드 몬클레르 5개, Jente 프라다·미우미우 각 5개가 지난주 한 자리(9·10위)에 뭉쳐 있다가 이번 주 2~8위로 흩어졌다 — 낱점만 들어오는 위탁 재고를 먼저 예약해야 손에 넣는다는 조바심이 그 사이 실제 선택으로 갈렸다는 뜻이다. 위탁 채널은 신상 입고 첫 주엔 노출을 아끼고, 갈라지기 시작하는 둘째 주에 광고 예산을 태우는 편이 전환이 붙는다.","무신사·KREAM은 열 자리 모두 지난주 그대로다 — 나이키 에어포스 1 3종이 1~3위, 아디다스·노스페이스 스테디 라인업이 자리를 지킨 건 새로 고를 이유가 없어 하던 대로 고른 결과다. 두 채널은 지금 신상 캠페인보다 기존 인기 품목의 재입고 알림·품절 임박 문구가 더 잘 먹힌다.","프라다는 렉스몬드(리나일론 블루종 5위)와 Jente(숄더백 등 5개 품목) 양쪽에 동시에 잡힌다 — 한 곳만 보지 않고 여러 위탁 채널을 동시에 열어 먼저 걸리는 곳에서 집는 탐색이 드러난 것이다. 같은 시즌 상품을 복수 위탁 채널에 동시에 태우면 노출면이 두 배가 되니, 이번 시즌 프라다·몬클레르 신상은 단일 채널 독점보다 교차 입점이 유리하다.","몬클레르·프라다·미우미우처럼 낱점 재고인 신상은 입고 첫 주부터 개별 상품 페이지에 잔여 수량과 마감 시각을 바로 붙여, 9·10위에 뭉쳐 있는 구간 없이 곧장 선택이 갈리게 하라."],"keywords":["재고선점","마감회피","위탁신뢰","시즌초입","관성소비"],"anomalies":[{"itemId":"c15-2","note":"지난주 같은 자리에 뭉쳐 있던 다른 몬클레르 품목들 사이에서 이 자켓만 먼저 갈라져 나온 건, 낱점 재고를 먼저 잡아야 한다는 조바심이 실제 선택으로 옮겨간 결과다.","title":"MONCLER"},{"itemId":"c16-1","note":"프라다 숄더백 한 점을 두고 여러 사람이 몰렸다는 뜻으로, 위탁 특유의 지금 아니면 없다는 감각이 순위에 그대로 찍힌 것이다.","title":"PRADA"},{"itemId":"c14-6","note":"스니커즈·시계 옆에 카드게임 박스가 낀 건 리셀 심리가 품목을 가리지 않는다는 뜻 — 정가 매대에서 놓치면 여기서라도 확보해두자는 조바심이 카드팩까지 넘어온 것이다.","title":"포켓몬 TCG 메가 확장팩 스톰에메랄다 1 박스 (30팩/한글판)"}]}]};</script>
