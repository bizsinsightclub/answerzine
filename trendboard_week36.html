<title>대한민국 소비 트렌드 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#EEF1F4;
    --card:#FFFFFF;
    --surface-2:#F2F4F6;
    --ink:#191F28;
    --ink-soft:#4E5968;
    --ink-faint:#8B95A1;
    --line:#E5E8EB;
    --accent:#3182F6;
    --accent-soft:#EAF2FF;
    --accent-ink:#1B64DA;
    --danger:#E6394A;
    --danger-soft:#FDEBEC;
    --shadow-card:0 1px 2px rgba(15,23,42,.04), 0 10px 28px rgba(15,23,42,.07);
    --shadow-pop:0 8px 16px rgba(15,23,42,.10), 0 24px 56px rgba(15,23,42,.16);
    --veil:rgba(238,241,244,.82);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1012; --card:#1A1D21; --surface-2:#232629; --ink:#F2F4F6; --ink-soft:#AEB6C2;
      --ink-faint:#6C7480; --line:#2B2F34; --accent:#4C93FF; --accent-soft:#16233A; --accent-ink:#8FBBFF;
      --danger:#FF6B74; --danger-soft:#3A1E22;
      --shadow-card:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
      --shadow-pop:0 8px 16px rgba(0,0,0,.5), 0 28px 64px rgba(0,0,0,.55);
      --veil:rgba(14,16,18,.82);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1012; --card:#1A1D21; --surface-2:#232629; --ink:#F2F4F6; --ink-soft:#AEB6C2;
    --ink-faint:#6C7480; --line:#2B2F34; --accent:#4C93FF; --accent-soft:#16233A; --accent-ink:#8FBBFF;
    --danger:#FF6B74; --danger-soft:#3A1E22;
    --shadow-card:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
    --shadow-pop:0 8px 16px rgba(0,0,0,.5), 0 28px 64px rgba(0,0,0,.55);
    --veil:rgba(14,16,18,.82);
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace; font-variant-numeric:tabular-nums; }
  h1,h2,h3,.balance{ text-wrap:balance; }
  .topline-card{ padding:clamp(20px,3.2vw,30px); }
  .topline-head{
    font-size:clamp(21px,2.7vw,31px); font-weight:900; line-height:1.3; letter-spacing:-.02em;
    text-wrap:balance; word-break:keep-all; overflow-wrap:break-word; margin:0;
  }
  .topline-body{
    font-size:13.5px; line-height:1.75; color:var(--ink-soft); word-break:keep-all; overflow-wrap:break-word; margin:0;
  }
  .verse{ white-space:pre-line; }
  .idea-card{ cursor:pointer; transition:border-color .12s ease; }
  .idea-card.is-open{ border-color:var(--accent); }
  .idea-collapsed-row{ display:flex; align-items:center; gap:10px; padding:16px 20px; }
  .topline-grid{ display:grid; grid-template-columns:1fr; gap:18px; }
  .topline-col{ min-width:0; display:flex; flex-direction:column; }
  @media (min-width:880px){
    .topline-grid{ grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); column-gap:clamp(28px,3.4vw,52px); gap:0; }
    .topline-col-a{ justify-content:space-between; }
    .topline-col-b{ border-left:1px solid var(--line); padding-left:clamp(24px,3vw,44px); }
  }
  ::selection{ background:var(--accent-soft); color:var(--accent-ink); }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  .card{ background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow-card); border-radius:20px; }

  /* ---------- masthead ---------- */
  .masthead{
    position:sticky; top:0; z-index:30;
    background:var(--veil); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }

  /* ---------- rank grid ---------- */
  .rank-grid{ display:grid; }
  .grid-head-cell{
    padding:14px 14px 10px; font-weight:700; font-size:14px; color:var(--ink); text-align:center;
    border-bottom:1px solid var(--line); position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .grid-head-cell > .grid-head-src{ width:100%; }
  .grid-head-src{
    height:13px; margin-top:3px; font-size:10px; font-weight:600; color:var(--ink-faint); text-align:center;
    opacity:0; transition:opacity .12s ease; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .grid-head-cell:hover .grid-head-src{ opacity:1; }
  @media (hover:none){ .grid-head-src{ opacity:.75; } }
  .grid-head-cell .manual-input{ text-align:center; }
  .grid-group-cell{
    padding:10px 12px 8px; text-align:center; font-size:11.5px; font-weight:800; letter-spacing:.02em;
    color:var(--ink-soft); background:var(--surface-2); border-bottom:1px solid var(--line);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .grid-group-cell + .grid-group-cell{ border-left:1px solid var(--line); }

  .grid-cell{
    display:flex; align-items:center; width:100%; height:100%; min-height:66px;
    padding:10px 14px; border-bottom:1px solid var(--line); text-align:left;
    background:transparent; border-left:none; border-right:none; border-top:none;
    color:var(--ink); cursor:pointer; position:relative; transition:background-color .12s ease;
  }
  .grid-cell:not(:last-child){ border-right:1px solid var(--line); }
  .grid-cell.is-empty{ cursor:default; color:var(--ink-faint); }
  .grid-cell.is-hoverable:hover{ background:var(--surface-2); }
  .grid-cell.is-selected{ background:var(--accent-soft); }
  .grid-cell.is-dim{ opacity:.4; }
  .grid-cell.is-failed{ cursor:pointer; background:var(--danger-soft); box-shadow:inset 0 -2px 0 0 var(--danger); }
  .grid-cell.is-failed:hover{ background:var(--danger-soft); filter:brightness(0.97); }
  .grid-cell.is-variant-echo::after{
    content:""; position:absolute; inset:4px; border-radius:10px; border:1.5px solid var(--accent-ink); pointer-events:none;
  }
  .rank-cell{
    display:flex; align-items:center; font-size:13px; color:var(--ink-faint); font-weight:600;
    padding:10px 8px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); justify-content:center;
    position:sticky; left:0; z-index:6; background:var(--card);
  }
  .grid-corner{ position:sticky; left:0; z-index:7; background:var(--card); border-bottom:1px solid var(--line); border-right:1px solid var(--line); }
  .grid-group-corner{ position:sticky; left:0; z-index:7; background:var(--surface-2); border-bottom:1px solid var(--line); border-right:1px solid var(--line); }
  .cell-title{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:14.5px; font-weight:500; line-height:1.35; }
  .cell-artist{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .hl{
    background:linear-gradient(transparent 56%, rgba(255,214,0,.55) 56%);
    color:inherit; padding:0 1px; border-radius:2px;
  }
  .rank-move{
    display:inline-flex; align-items:center; margin-bottom:4px; font-size:10.5px; font-weight:700;
    letter-spacing:-.01em; font-variant-numeric:tabular-nums; pointer-events:none; line-height:1.2;
  }
  .rank-move.is-up{ color:#E6394A; }
  .rank-move.is-down{ color:var(--accent); }
  .rank-move.is-same{ color:var(--ink-faint); font-weight:600; }
  .rank-move.is-new{ color:#fff; background:#0B7A46; border-radius:999px; padding:1px 6px; font-size:9.5px; }
  .sel-badge{
    position:absolute; top:6px; right:6px; width:19px; height:19px; border-radius:999px;
    background:var(--accent); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(49,130,246,.4);
  }

  /* ---------- ranking full-width band + scroll affordance ---------- */
  /* 1120 본문을 벗어나 뷰포트 폭까지 넓힌다. 100vw-48 은 스크롤바(≈17px)보다 커서 가로 넘침이 없다. */
  .rank-card{ position:relative; width:min(1600px, calc(100vw - 48px)); margin-left:50%; transform:translateX(-50%); }
  .rank-card::after{
    content:""; position:absolute; top:0; right:0; width:40px; height:100%;
    background:linear-gradient(90deg, transparent, var(--card));
    pointer-events:none; z-index:8; border-radius:0 20px 20px 0;
  }
  .scroll-hint{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:12px; font-weight:600; color:var(--ink-faint); margin:0 0 10px; letter-spacing:.01em;
  }

  /* ---------- category (group) insights ---------- */
  .ginsight-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  .ginsight-card{
    position:relative; text-align:left; width:100%; cursor:default; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:16px 18px;
    box-shadow:var(--shadow-card); transition:border-color .12s ease, transform .12s ease;
  }
  .ginsight-card:hover, .ginsight-card:focus-within{ border-color:var(--accent); transform:translateY(-1px); z-index:20; }
  .ginsight-card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .ginsight-group{ font-size:11.5px; font-weight:800; letter-spacing:.02em; color:var(--accent-ink); margin-bottom:8px; }
  .ginsight-money{ font-size:15px; font-weight:800; line-height:1.4; color:var(--ink); word-break:keep-all; }
  .ginsight-cue{ margin-top:10px; font-size:11.5px; font-weight:600; color:var(--ink-faint); }
  .ginsight-pop{
    position:absolute; left:0; right:0; top:calc(100% + 8px); z-index:41;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow-pop); padding:16px 16px 14px;
    opacity:0; transform:translateY(4px); pointer-events:none;
    transition:opacity .12s ease, transform .12s ease;
  }
  .ginsight-card:hover .ginsight-pop, .ginsight-card:focus-within .ginsight-pop{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .ginsight-pop-head{ font-size:16px; font-weight:900; line-height:1.3; letter-spacing:-.01em; margin-bottom:8px; word-break:keep-all; }
  .ginsight-pop-sum{ font-size:13px; color:var(--ink-soft); line-height:1.55; margin:0 0 4px; word-break:keep-all; }
  .ginsight-pop-row{ display:flex; gap:8px; margin-top:8px; font-size:12.5px; line-height:1.5; color:var(--ink); word-break:keep-all; }
  .ginsight-pop-n{ flex-shrink:0; font-size:11px; font-weight:800; color:var(--accent-ink); }
  .ginsight-pop-keys{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
  @media (hover:none){ .ginsight-cue::after{ content:" (눌러서 보기)"; } }

  @keyframes shimmer{ 0%{ background-position:-200% 0; } 100%{ background-position:200% 0; } }
  .shimmer{
    background:linear-gradient(90deg, var(--surface-2) 25%, var(--line) 45%, var(--surface-2) 65%);
    background-size:200% 100%; animation:shimmer 1.4s ease-in-out infinite; border-radius:8px; height:14px; width:80%;
  }
  @media (prefers-reduced-motion: reduce){ .shimmer{ animation:none; background:var(--surface-2); } }

  /* ---------- popup ---------- */
  .reason-pop{
    position:fixed; width:340px; max-height:420px; overflow:hidden; z-index:50;
    background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow-pop);
    padding:18px 18px 16px; opacity:0; transform:translateY(4px); pointer-events:none;
    transition:opacity .12s ease, transform .12s ease;
  }
  .reason-pop.is-open{ opacity:1; transform:translateY(0); pointer-events:auto; }
  @media (prefers-reduced-motion: reduce){ .reason-pop{ transition:none; } }
  .chip{
    display:inline-flex; align-items:center; font-size:12px; font-weight:500; color:var(--ink-soft);
    background:var(--surface-2); border-radius:999px; padding:4px 10px; margin:0 6px 6px 0;
  }
  .reason-row{ display:flex; gap:10px; padding:7px 0; border-top:1px solid var(--line); }
  .reason-row:first-of-type{ border-top:none; }
  .reason-rank{ font-size:11px; font-weight:700; color:var(--accent-ink); background:var(--accent-soft); border-radius:6px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }

  /* ---------- selection bar ---------- */
  .selection-bar{
    position:sticky; bottom:16px; z-index:35; margin-top:16px;
    background:var(--ink); color:#fff; border-radius:16px; box-shadow:var(--shadow-pop);
    padding:12px 12px 12px 20px; display:flex; align-items:center; gap:14px;
    transform:translateY(0); transition:transform .18s ease, opacity .18s ease;
  }
  :root[data-theme="dark"] .selection-bar, :root:not([data-theme="light"]) .selection-bar{ background:var(--card); border:1px solid var(--line); color:var(--ink); }
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .selection-bar{ background:var(--ink); color:#fff; } }
  .selection-bar.is-hidden{ transform:translateY(90px); opacity:0; pointer-events:none; }

  .btn{ border-radius:12px; font-weight:700; font-size:14.5px; padding:11px 18px; transition:transform .08s ease, background-color .12s ease, opacity .12s ease; cursor:pointer; border:none; }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ cursor:default; opacity:.45; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover:not(:disabled){ background:var(--accent-ink); }
  .btn-ghost{ background:var(--surface-2); color:var(--ink); }
  .btn-ghost:hover:not(:disabled){ background:var(--line); }
  .btn-line{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn-line:hover:not(:disabled){ background:var(--surface-2); }
  .btn-pill-white{ background:rgba(255,255,255,.14); color:#fff; }
  .btn-pill-white:hover:not(:disabled){ background:rgba(255,255,255,.22); }

  /* ---------- bundle cards ---------- */
  .bundle-card{ border-radius:18px; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow-card); overflow:hidden; transition:border-color .12s ease, background-color .12s ease; cursor:pointer; }
  .bundle-card.is-active{ border-color:var(--accent); }
  .bundle-card + .bundle-card{ margin-top:10px; }
  .bundle-collapsed-row{ display:flex; align-items:center; gap:10px; padding:14px 18px; }
  .bundle-x{ flex-shrink:0; margin-left:auto; width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    border:none; border-radius:8px; background:transparent; color:var(--ink-faint); font-size:16px; line-height:1; cursor:pointer;
    opacity:0; transition:opacity .12s ease, background .12s ease, color .12s ease; }
  .bundle-card:hover .bundle-x, .bundle-x:focus-visible{ opacity:1; }
  .bundle-x:hover{ background:var(--surface-2); color:var(--danger); }
  @media (hover:none){ .bundle-x{ opacity:1; } }
  .bundle-item-chip{ display:flex; align-items:baseline; gap:8px; padding:8px 12px; background:var(--surface-2); border-radius:10px; font-size:13px; }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,8px); z-index:60;
    background:var(--ink); color:#fff; font-size:13.5px; font-weight:500; padding:11px 18px; border-radius:999px;
    box-shadow:var(--shadow-pop); opacity:0; transition:opacity .16s ease, transform .16s ease; pointer-events:none;
  }
  :root:not([data-theme="light"]) .toast{ background:var(--card); border:1px solid var(--line); color:var(--ink); }
  @media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .toast{ background:var(--ink); color:#fff; } }
  .toast.is-shown{ opacity:1; transform:translate(-50%,0); }

  .manual-input{ width:100%; background:transparent; border:none; font:inherit; color:var(--ink); padding:8px 6px; border-radius:8px; }
  .manual-input:focus{ background:var(--accent-soft); }

  .skeleton-row{ display:flex; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
</style>

</div>

function csvCell(v) {

function buildChartCsv(week, gridCats, groupOf, items, moveOf) {
  const head = ["주차", "상위 그룹", "카테고리", "출처", "순위", "항목", "부가 정보", "순위 변동", "지난 주 순위", "이유 제목", "요약", "이유", "키워드", "신뢰도"];
  const rows = [head.map(csvCell).join(",")];
  for (let rank = 1; rank <= 10; rank++) {
    gridCats.forEach((cat) => {
      const it = items.find((x) => x.category === cat && x.rank === rank);
      if (!it || !it.raw) return;
      const mv = moveOf(it);
      const r = it.reason || {};
      rows.push([
        week.label || "",
        groupOf[cat] || "",
        cat,
        CATEGORY_SOURCES[cat] || "",
        rank,
        it.title || "",
        it.artist || "",
        mv ? (mv.kind === "new" ? "NEW" : mv.kind === "same" ? "유지" : mv.label) : "",
        mv && mv.before != null ? mv.before : "",
        r.headline || "",
        r.summary || "",
        (r.reasons || []).map((x, i) => (i + 1) + ") " + (x.detail || "")).join(" "),
        (r.keywords || []).join(", "),
        r.confidence || ""
      ].map(csvCell).join(","));
    });
  }
  return "\uFEFF" + rows.join("\r\n");
}
function buildGroupPlan(categories) {
  const left = categories.slice();
  const groups = [], ordered = [];
  CATEGORY_GROUPS.forEach((g) => {
    const hit = g.cats.filter((c) => left.indexOf(c) !== -1);
    if (!hit.length) return;
    hit.forEach((c) => { ordered.push(c); left.splice(left.indexOf(c), 1); });
    groups.push({ label: g.label, count: hit.length });
  });
  if (left.length) {
    left.forEach((c) => ordered.push(c));
    groups.push({ label: groups.length ? "기타" : "", count: left.length });
  }
  return { ordered, groups, useGroups: groups.length > 1 && groups.some((g) => g.label && g.label !== "기타") };
}

  return { title: String(raw).trim(), artist: null };
}

  "c5-4": ["잔잔한 정서", "자극적인 사건 없이 정서로 끌고 가는 작품이다. 큰 흥행보다 특정 관객층의 선택이 순위에 반영됐다.", ["여행과 도시를 소재로 한 정서적 관람 수요가 있다.", "관객층이 좁은 대신 재관람 비중이 높다.", "대형 배급작 사이에서 대안적 선택지로 소비됐다."], ["경주", "잔잔한영화", "정서"], "content", "low"],
  "c5-5": ["집착 관람","집착이라는 감정을 전면에 둔 스릴러다. 불편한 감정을 안전한 거리에서 관찰하려는 수요가 관람으로 이어진다.",["자극적 소재가 관람 전 화제성을 먼저 만들었다.","상영 시간이 짧아 회전율이 높다.","스릴러 장르의 고정 관객층이 초반 관람을 채웠다."],["옵세션","스릴러","집착"],"content","medium"],
  "c5-6": ["무대 관람", "방송 콘텐츠의 무대를 극장에서 보는 형태다. 새로운 이야기가 아니라 이미 좋아하는 무대를 다시 소비하는 것이다.", ["방송 팬층이 극장 관람으로 이어졌다.", "무대 중심 구성이라 팬 참여형 관람이 가능하다.", "짧은 상영 기간이 조기 관람을 유도했다."], ["싱어게인", "무대영화", "팬덤"], "content", "medium"],
  "c5-7": ["실화 소재", "실제 사건을 바탕에 둔 작품이다. 소재의 무게가 관람 동기를 만든 쪽에 가깝다.", ["실화 기반이라는 점이 관람 결정에 직접 영향을 줬다.", "언론 보도가 개봉과 맞물려 노출을 만들었다.", "단체 관람 수요가 일부 확인된다."], ["실화", "드라마", "사회적소재"], "content", "medium"],
  "c5-8": ["액션 수요", "무거운 소재 사이에서 오락성 액션이 자리를 지켰다. 장르 자체에 대한 꾸준한 수요가 순위를 만든다.", ["액션 장르의 고정 관객층이 두텁다.", "주연 배우의 이전 흥행작 이미지가 신뢰를 만들었다.", "러닝타임과 회전율이 좋아 상영 회차가 많다."], ["액션", "장르수요", "배우팬덤"], "content", "medium"],
  "c5-9": ["메타 소재", "만드는 과정을 소재로 삼은 작품이다. 업계 이야기를 들여다보는 재미가 관람 동기가 된다.", ["콘텐츠 제작 과정을 소재로 삼아 업계 관심층이 유입됐다.", "익숙한 클리셰를 비트는 구성이 회자됐다.", "관객층이 좁아 규모보다 화제성이 앞선다."], ["메타", "제작기", "코미디"], "content", "low"],
  "c5-10": ["시리즈 관성", "매년 돌아오는 시리즈의 신작이다. 개별 작품의 완성도보다 시리즈를 계속 본다는 습관이 관람을 만든다.", ["매년 개봉하는 시리즈라 관람이 연례 행사처럼 굳어졌다.", "원작 팬층과 가족 단위 관람 수요가 겹친다.", "더빙과 자막 상영이 병행돼 관객층이 넓다."], ["명탐정코난", "시리즈", "애니메이션"], "content", "high"],
  "c6-1": ["지연 수요", "활동 주기가 긴 아티스트의 공연이라, 몇 년간 쌓인 수요가 한 회차에 몰린다. 소비는 지금 일어나지만 수요는 오래전부터 적립된 것이다.", ["공연 자체가 자주 열리지 않아 티켓이 희소재로 다뤄진다.", "곡 목록이 이미 검증돼 있어 처음 가는 관객도 실패 위험이 낮다.", "구매력이 있는 30~40대 팬층이 좌석 등급을 크게 가리지 않는다."], ["김동률", "장기팬덤", "희소공연", "지연수요"], "content", "medium"],
  "c6-2": ["브랜드 통로", "카드사 브랜드가 해외 아티스트를 데려오는 통로 역할을 한다. 관객은 아티스트를 사면서 동시에 그 브랜드의 시리즈를 신뢰한다.", ["시리즈 자체가 라인업 검증 장치로 작동해 아티스트를 몰라도 표를 산다.", "카드 회원 선예매가 초기 판매를 앞당긴다.", "단발 내한보다 시리즈 회차라는 점이 안정감을 준다."], ["슈퍼콘서트", "브랜드시리즈", "선예매", "내한"], "content", "medium"],
  "c6-3": ["묶음 관람", "한 장으로 여러 팀을 본다. 개별 공연을 각각 예매할 때보다 시간당 만족의 밀도가 높다.", ["라인업 다수를 하나의 티켓으로 소화하는 구조라 단가 대비 관람량이 크다.", "모르는 팀을 발견할 여지가 있어 탐색 목적의 구매가 섞인다.", "야외·지역 개최라 나들이 일정과 함께 결정된다."], ["페스티벌", "인디", "묶음소비", "발견"], "content", "medium"],
  "c6-4": ["규모 경신", "팬덤 크기가 공연장 규모를 밀어올린 사례다. 좌석이 늘어난 만큼 경쟁이 줄어드는 게 아니라, 규모 자체가 화제가 되어 수요를 다시 부른다.", ["스타디움급 회차라 좌석 수가 크되 동시 접속 경쟁도 함께 커진다.", "시즌2 표기가 지난 공연을 못 본 관객의 이월 수요를 자극한다.", "중장년 팬층의 결제 전환율이 높아 예매 초기에 소진된다."], ["임영웅", "스타디움", "이월수요", "팬덤규모"], "content", "medium"],
  "c6-5": ["계절 의례", "해마다 같은 시기에 열리는 행사다. 콘텐츠가 새로워서가 아니라 계절이 오면 자동으로 떠오르는 일정이라 팔린다.", ["가을이라는 시기 자체가 검색과 예매의 방아쇠가 된다.", "공연 관람보다 모임·음주라는 행위가 목적이라 동반 인원이 많다.", "해마다 반복돼 무엇을 기대할지 이미 알고 있다."], ["옥토버페스트", "계절이벤트", "동반소비", "연례"], "content", "medium"],
  "c6-6": ["앙코르 이월", "본 공연에서 표를 못 구한 수요가 앙코르 회차로 그대로 넘어왔다. 새 관객이 아니라 밀린 관객이다.", ["앙코르라는 표기 자체가 앞선 회차의 매진을 증명해 신뢰 신호가 된다.", "본 공연을 본 관객의 재관람 수요가 겹친다.", "회차가 한정적이라 기다림이 다시 경쟁을 만든다."], ["앙코르", "이월수요", "재관람", "한정회차"], "content", "medium"],
  "c6-7": ["실물 접점", "온라인에서만 만나던 대상을 오프라인에서 확인하려는 수요다. 공연은 콘텐츠 소비가 아니라 존재 확인의 자리로 쓰인다.", ["평소 접점이 화면에 한정돼 있어 실물 이벤트의 희소성이 크다.", "월드투어 회차라 국내 공연이 한 번뿐이라는 조건이 붙는다.", "팬덤의 굿즈·동행 소비가 티켓과 함께 묶여 움직인다."], ["PLAVE", "버추얼", "실물접점", "월드투어"], "content", "medium"],
  "c6-8": ["소극장 경쟁", "규모가 작아 절대 좌석 수가 적다. 팬덤의 크기보다 공급의 작음이 순위를 만든다.", ["단독 공연이라 회차당 좌석이 제한적이다.", "보컬 중심 공연이라 음향이 좋은 중소 규모를 택한 결과다.", "코어 팬층의 전 회차 관람 성향이 경쟁을 키운다."], ["산들", "소극장", "공급제약", "코어팬덤"], "content", "medium"],
  "c6-9": ["내한 주기", "몇 년에 한 번 오는 아티스트라 대체재가 없다. 다음이 언제일지 모른다는 조건이 결정을 앞당긴다.", ["국내 공연 기회가 드물어 이번을 놓치면 기약이 없다는 판단이 작동한다.", "히트곡이 대중적으로 넓게 알려져 팬덤 밖 관객도 유입된다.", "해외 투어 일정에 국내 회차가 한 번만 잡힌다."], ["찰리푸스", "내한", "희소성", "대중인지"], "content", "medium"],

  "c7-1": ["정서 대리", "자기 감정을 무대에 대신 맡기는 관극이다. 이야기의 결말보다 그 감정을 확인하는 것이 목적이다.", ["청소년기의 고립을 다뤄 20~30대 관객의 자기 투사가 강하다.", "넘버가 이미 널리 알려져 첫 관람의 진입 장벽이 낮다.", "라이선스 작품이라 원작 완성도에 대한 신뢰가 선행한다."], ["에반핸슨", "자기투사", "라이선스", "넘버"], "content", "medium"],
  "c7-2": ["초연 선점", "창작 신작이라 아직 평가가 굳지 않았다. 먼저 보고 먼저 말하려는 관객이 초기 회차를 채운다.", ["초연은 재연 대비 회차가 적어 관람 기회 자체가 제한적이다.", "창작 초연에 반응하는 관극 커뮤니티의 선점 수요가 있다.", "캐스팅 조합 수가 적어 원하는 회차 경쟁이 세다."], ["창작초연", "선점", "캐스팅", "대학로"], "content", "medium"],
  "c7-3": ["회전문 관극", "같은 작품을 여러 번 본다. 새로운 이야기를 찾는 소비가 아니라 같은 이야기를 다른 배우로 다시 보는 소비다.", ["캐스팅 조합마다 다른 공연으로 취급돼 관람 횟수가 곱해진다.", "반복 상연 이력이 길어 무엇을 기대할지 이미 안다.", "넘버 중심 작품이라 음악만으로도 재관람 동기가 생긴다."], ["드라큘라", "회전문", "멀티캐스팅", "재관람"], "content", "medium"],
  "c7-4": ["가족 동반", "한 사람이 아니라 가구 단위로 결제한다. 티켓 한 장의 결정이 여러 장의 구매로 이어진다.", ["아이 동반 관람이 전제라 1건당 구매 매수가 크다.", "원작 애니메이션의 인지도가 설명을 대신한다.", "방학·주말 회차에 수요가 집중된다."], ["겨울왕국", "가족동반", "IP", "다매수"], "content", "medium"],
  "c7-5": ["신작 탐색", "처음 보는 제목이 상위에 있다는 것 자체가 탐색 수요의 신호다. 검증되지 않은 쪽으로 움직인 소수의 관객이 순위를 만든다.", ["신작이라 사전 정보가 적고 후기가 곧 구매 근거가 된다.", "공연 회차와 좌석이 제한적이라 적은 절대 수로도 상위에 오른다.", "관극 커뮤니티의 초기 반응이 확산 속도를 결정한다."], ["신작", "탐색소비", "초기후기", "소규모"], "content", "low"],

const PREFILLED_VARIANTS = [["c2-2", "c2-5"], ["c3-3", "c3-4"], ["c3-5", "c3-7"], ["c18-1", "c18-2"], ["c7-3", "c7-9"], ["c12-7", "c12-9"], ["c14-2", "c14-6"]];
function attachPrefilled(items) {
  const groupOf = {};
  PREFILLED_VARIANTS.forEach((g) => g.forEach((id) => { groupOf[id] = g; }));
  return items.map((it) => {
    const p = PREFILLED[it.id];
    if (!p) return it;
    return {
      ...it,
      itemType: p[4] || "content",
      status: "ready",
      prefilled: true,
      variantGroup: groupOf[it.id] || null,
      reason: {
        headline: p[0],
        summary: p[1],
        reasons: (p[2] || []).map((d) => ({ detail: d, anchorKeyword: "" })),
        keywords: p[3] || [],
        confidence: p[5] || "medium"
      }
    };
  });
}

const PREV_KEY = "trend-sensing:prev:v1";
function normTitleKey(v) {

}

const SAMPLE_PREV_OVERRIDE = { "c1-8": 6 };
function makeSamplePrev() {
  const map = {}, ids = {};
  DEMO_MATRIX.rows.slice(0, 10).forEach((row, ri) => {
    DEMO_MATRIX.categories.forEach((cat, ci) => {
      const raw = row[ci];
      if (raw === void 0 || raw === null || String(raw).trim() === "") return;
      const id = "c" + (ci + 1) + "-" + (ri + 1);
      const parsed = parseRawTitle(raw);
      if (!map[cat]) map[cat] = {};
      const before = SAMPLE_PREV_OVERRIDE[id] || ri + 1;

function snapshotChart(items) {
  const map = {};
  items.forEach((it) => {
    if (!it || !it.raw) return;

    map[it.category][normTitleKey(it.title)] = it.rank;

}

function sameChart(a, b) {
  const flat = (items) => items.filter((it) => it && it.raw).map((it) => it.category + "|" + it.rank + "|" + normTitleKey(it.title)).sort().join("~");
  return flat(a) === flat(b);
}
const PREF_KEY = "trend-sensing:prefs:v1";

const IDEA_PREF_KEY = "trend-sensing:ideaprefs:v1";
function loadPrefs(key) {
  try {
    const raw = localStorage.getItem(key || PREF_KEY);
    if (!raw) return { liked: [], disliked: [] };
    const d = JSON.parse(raw);
    return { liked: Array.isArray(d && d.liked) ? d.liked : [], disliked: Array.isArray(d && d.disliked) ? d.disliked : [] };
  } catch (e) {
    return { liked: [], disliked: [] };
  }
}
function savePrefs(p, key) {
  try { localStorage.setItem(key || PREF_KEY, JSON.stringify(p)); } catch (e) {}
}
// 같은 묶음을 여러 번 눌러도 하나만 남도록 제목 기준으로 정리한다
function upsertPref(prefs, rating, record) {
  const strip = (arr) => arr.filter((x) => x.title !== record.title);
  const liked = strip(prefs.liked);
  const disliked = strip(prefs.disliked);
  if (rating === "up") liked.unshift(record);
  if (rating === "down") disliked.unshift(record);
  return { liked: liked.slice(0, 12), disliked: disliked.slice(0, 8) };
}
