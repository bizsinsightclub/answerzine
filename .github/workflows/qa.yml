name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: 테스트 · 데이터 검증 · 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 브라우저 설치 (A4·콘솔 실측용)
        run: npx playwright install --with-deps chromium

      - name: 단위 테스트
        run: node tools/test.mjs

      - name: 데이터 검증 (tools/qa.mjs)
        run: node tools/qa.mjs

      # 배포와 같은 조건으로 검증한다. 기본 경로가 빠지면 자산이 전부 404다.
      - name: 빌드 (배포 조건)
        run: node build/build.mjs
        env:
          BASE_PATH: ${{ github.event.repository.name }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io

      - name: 산출물 검증 (build/verify.mjs)
        run: node build/verify.mjs
        env:
          BASE_PATH: ${{ github.event.repository.name }}

  links:
    name: 출처 링크 생존 확인
    runs-on: ubuntu-latest
    continue-on-error: true   # 외부 사이트 장애로 배포를 막지 않는다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: sourceUrl HTTP 상태 확인
        run: |
          node -e '
          import("node:fs").then(async fs => {
            const dir = "issues";
            if (!fs.existsSync(dir)) return;
            const urls = new Set();
            for (const f of fs.readdirSync(dir).filter(f => f.endsWith(".json"))) {
              const d = JSON.parse(fs.readFileSync(dir + "/" + f, "utf8"));
              for (const s of (d.stories ?? d)) {
                const u = s.blocks?.find(b => b.type === "stat")?.sourceUrl;
                if (u) urls.add(u);
                if (s.anchorSourceUrl) urls.add(s.anchorSourceUrl);
              }
            }
            let bad = 0;
            for (const u of urls) {
              try {
                const r = await fetch(u, { method: "HEAD", redirect: "follow",
                                           signal: AbortSignal.timeout(15000) });
                console.log((r.ok ? "  ok  " : "  !!  ") + r.status + "  " + u);
                if (!r.ok) bad++;
              } catch (e) {
                console.log("  !!  ERR   " + u + "  (" + e.message + ")");
                bad++;
              }
            }
            console.log(bad ? `\n응답 실패 ${bad}건 — 출처를 확인할 것.` : "\n모든 출처 정상.");
            process.exit(bad ? 1 : 0);
          })'

  # 배포는 gh-pages 브랜치에 산출물을 밀어넣는 방식이다.
  # actions/deploy-pages를 쓰지 않는 이유: 2026-08-06에 액션 다운로드 서비스가
  # 장애를 일으켜 발행이 막혔다. 이 방식은 로컬에서 `npm run deploy` 한 줄로도
  # 똑같이 동작하므로, 남의 인프라가 죽어도 발행할 수 있다.
  pages:
    name: 웹진 배포 (gh-pages)
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # GitHub Pages 프로젝트 사이트는 /<저장소명>/ 하위에 놓인다.
      # 접두사 없이 빌드하면 모든 자산이 404가 난다.
      - name: 빌드
        run: node build/build.mjs
        env:
          BASE_PATH: ${{ github.event.repository.name }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      # 대시보드·제작기는 저장소 JSON을 읽으므로 함께 올린다.
      - name: 운영 도구 동봉
        run: |
          mkdir -p dist/tools
          cp tools/dashboard.html tools/zine-builder.html dist/tools/
          cp -r domains sources issues runs dist/
          touch dist/.nojekyll
      - name: gh-pages 푸시
        run: |
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="answerzine deploy" -c user.email="noreply@answerzine.kr" \
              commit -q -m "deploy: ${GITHUB_SHA::8}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages:gh-pages
